<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <!-- 重命名:字母 A → B,直接表达"旧名字 → 新名字"的语义 -->
  <!-- A:左斜 + 右斜 + 中横 -->
  <line x1="4" y1="44" x2="12" y2="12" stroke="#228BE6" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="20" y2="44" stroke="#228BE6" stroke-width="3" stroke-linecap="round"/>
  <line x1="7" y1="32" x2="17" y2="32" stroke="#228BE6" stroke-width="3" stroke-linecap="round"/>
  <!-- 箭头 -->
  <line x1="23" y1="28" x2="33" y2="28" stroke="#228BE6" stroke-width="3" stroke-linecap="round"/>
  <polygon points="35,28 30,24 30,32" fill="#228BE6"/>
  <!-- B:竖干 + 上下两个半圆弧(凸向右) -->
  <line x1="40" y1="14" x2="40" y2="42" stroke="#228BE6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 14 Q 50 14, 50 21 Q 50 28, 40 28" fill="none" stroke="#228BE6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 28 Q 52 28, 52 35 Q 52 42, 40 42" fill="none" stroke="#228BE6" stroke-width="3" stroke-linecap="round"/>
</svg>