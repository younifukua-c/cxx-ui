<!doctype html>
<html><head><meta charset="utf-8"><title>展开 / 收起 图标对比</title>
<style>
:root { --bg: #1e1e1e; --card: #252525; --line: #2f2f2f; --fg: #d4d4d4; --dim: #858585; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
h2 { color: var(--dim); font-size: 12px; text-transform: uppercase; margin: 0 0 8px; letter-spacing: 1px; }
.row { display: flex; gap: 16px; margin-bottom: 16px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 10px; min-width: 110px; text-align: center; }
.item img { width: 32px; height: 32px; display: block; margin: 0 auto 8px; }
.item .name { font: 11px monospace; color: var(--fg); }
.item .state { color: var(--dim); font-size: 10px; }
</style>
</head>
<body>

<h2>展开(61-expand · 3 条粗线)</h2>
<div class="row">
  <div class="item"><img src="/icons/61-expand.svg"><div class="name">default</div><div class="state">3 条线</div></div>
  <div class="item"><img src="/icons/61-expand-hover.svg"><div class="name">hover</div><div class="state">白主</div></div>
  <div class="item"><img src="/icons/61-expand-active.svg"><div class="name">active</div><div class="state">灰</div></div>
  <div class="item"><img src="/icons/61-expand-disabled.svg"><div class="name">disabled</div><div class="state">深灰</div></div>
</div>

<h2 style="margin-top:24px">收起(62-collapse · 1 条粗线)</h2>
<div class="row">
  <div class="item"><img src="/icons/62-collapse.svg"><div class="name">default</div><div class="state">1 条线</div></div>
  <div class="item"><img src="/icons/62-collapse-hover.svg"><div class="name">hover</div><div class="state">白主</div></div>
  <div class="item"><img src="/icons/62-collapse-active.svg"><div class="name">active</div><div class="state">灰</div></div>
  <div class="item"><img src="/icons/62-collapse-disabled.svg"><div class="name">disabled</div><div class="state">深灰</div></div>
</div>

<h2 style="margin-top:24px">对比(并排)</h2>
<div class="row">
  <div class="item"><img src="/icons/61-expand.svg" style="width:48px;height:48px"><div class="name">61-expand</div><div class="state">3 条</div></div>
  <div class="item"><img src="/icons/62-collapse.svg" style="width:48px;height:48px"><div class="name">62-collapse</div><div class="state">1 条</div></div>
</div>

</body></html>
