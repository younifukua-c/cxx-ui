<!doctype html>
<html><head><meta charset="utf-8"><title>设置/帮助 新旧对比</title>
<style>
:root { --bg: #1e1e1e; --btn-bg: #2a2a2a; --btn-bg-hover: #3a3a3a; }
body { margin: 0; padding: 24px; background: var(--bg); color: #d4d4d4; font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
h2 { color: #858585; font-size: 12px; text-transform: uppercase; margin: 24px 0 8px; }
.row { display: flex; gap: 24px; align-items: center; }
.btn { background: var(--btn-bg); border: 0; border-radius: 6px; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.btn:hover { background: var(--btn-bg-hover); }
.btn.transparent { background: transparent; }
.btn.transparent:hover { background: var(--btn-bg); }
.btn img { width: 18px; height: 18px; }
</style>
</head>
<body>
<h2>新设计(6 齿 / 2px 描边) + 浅底按钮</h2>
<div class="row">
  <button class="btn"><img src="/icons/01-settings.svg" alt="settings"></button>
  <button class="btn"><img src="/icons/02-help.svg" alt="help"></button>
  <button class="btn transparent"><img src="/icons/01-settings.svg" alt="settings"></button>
  <button class="btn transparent"><img src="/icons/02-help.svg" alt="help"></button>
</div>
<h2>4 态对比(新)</h2>
<div class="row">
  <img src="/icons/01-settings.svg" width="18" height="18" alt="">
  <img src="/icons/01-settings-hover.svg" width="18" height="18" alt="">
  <img src="/icons/01-settings-active.svg" width="18" height="18" alt="">
  <img src="/icons/01-settings-disabled.svg" width="18" height="18" alt="">
  <img src="/icons/02-help.svg" width="18" height="18" alt="">
  <img src="/icons/02-help-hover.svg" width="18" height="18" alt="">
  <img src="/icons/02-help-active.svg" width="18" height="18" alt="">
  <img src="/icons/02-help-disabled.svg" width="18" height="18" alt="">
</div>
<h2>大尺寸 56×56 自核细节</h2>
<div class="row">
  <img src="/icons/01-settings.svg" width="56" height="56" alt="">
  <img src="/icons/02-help.svg" width="56" height="56" alt="">
</div>
</body></html>
