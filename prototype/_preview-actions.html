<!doctype html>
<html><head><meta charset="utf-8"><title>操作类图标对比</title>
<style>
:root { --bg: #1e1e1e; --card: #252525; --line: #2f2f2f; --fg: #d4d4d4; --dim: #858585; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
h2 { color: var(--dim); font-size: 12px; text-transform: uppercase; margin: 24px 0 8px; letter-spacing: 1px; }
.row { display: flex; flex-wrap: wrap; gap: 16px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 10px; min-width: 110px; text-align: center; }
.item img { width: 32px; height: 32px; display: block; margin: 0 auto 8px; }
.item .name { font: 11px monospace; color: var(--fg); }
.item .state { color: var(--dim); font-size: 10px; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 6px; padding: 18px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<h2>新建(5 个)</h2>
<div class="row">
  <div class="item"><img src="/icons/03-new-project.svg"><div class="name">03-new-project</div><div class="state">新建项目</div></div>
  <div class="item"><img src="/icons/04-new-fork.svg"><div class="name">04-new-fork</div><div class="state">新建派生</div></div>
  <div class="item"><img src="/icons/18-new-branch.svg"><div class="name">18-new-branch</div><div class="state">新建分支</div></div>
  <div class="item"><img src="/icons/45-new-branch-plus.svg"><div class="name">45-new-branch-plus</div><div class="state">新建分支 +</div></div>
  <div class="item"><img src="/icons/46-new-branch-bold.svg"><div class="name">46-new-branch-bold</div><div class="state">新建分支(bold)</div></div>
</div>
<h2>重命名(1 个)</h2>
<div class="row">
  <div class="item"><img src="/icons/49-rename-bold.svg"><div class="name">49-rename-bold</div><div class="state">重命名</div></div>
</div>
<h2>压缩(1 个) / 复制(1 个)</h2>
<div class="row">
  <div class="item"><img src="/icons/51-compress.svg"><div class="name">51-compress</div><div class="state">压缩</div></div>
  <div class="item"><img src="/icons/52-copy.svg"><div class="name">52-copy</div><div class="state">复制</div></div>
</div>
</body></html>
