<!doctype html>
<html><head><meta charset="utf-8"><title>unknown 图标</title>
<style>
:root { --bg: #1e1e1e; --card: #252525; --line: #2f2f2f; --fg: #d4d4d4; --dim: #858585; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
h2 { color: var(--dim); font-size: 12px; text-transform: uppercase; margin: 0 0 8px; }
.row { display: flex; gap: 16px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 10px; min-width: 110px; text-align: center; }
.item img { width: 32px; height: 32px; display: block; margin: 0 auto 8px; }
.item .name { font: 11px monospace; color: var(--fg); }
</style>
</head>
<body>
<h2>unknown(4 态)</h2>
<div class="row">
  <div class="item"><img src="/icons/file-types/file-unknown.svg"><div class="name">file-unknown</div></div>
  <div class="item"><img src="/icons/file-types/file-unknown-hover.svg"><div class="name">file-unknown-hover</div></div>
  <div class="item"><img src="/icons/file-types/file-unknown-active.svg"><div class="name">file-unknown-active</div></div>
  <div class="item"><img src="/icons/file-types/file-unknown-disabled.svg"><div class="name">file-unknown-disabled</div></div>
</div>
<h2 style="margin-top:24px">大尺寸自核</h2>
<div class="row">
  <div class="item"><img src="/icons/file-types/file-unknown.svg" width="56" height="56" style="width:56px;height:56px"><div class="name">56x56</div></div>
</div>
</body></html>
