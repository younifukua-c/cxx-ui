<!doctype html>
<html><head><meta charset="utf-8"><title>compress 颜色对比 · 蓝/绿/白</title>
<style>
:root { --bg: #1e1e1e; --card: #252525; --line: #2f2f2f; --fg: #d4d4d4; --dim: #858585; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
h2 { color: var(--dim); font-size: 12px; text-transform: uppercase; margin: 0 0 8px; letter-spacing: 1px; }
.row { display: flex; gap: 16px; margin-bottom: 12px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 10px; min-width: 110px; text-align: center; }
.item img { width: 32px; height: 32px; display: block; margin: 0 auto 8px; }
.item .name { font: 11px monospace; color: var(--fg); }
.item .state { color: var(--dim); font-size: 10px; }
.color { font-size: 10px; color: var(--dim); margin-top: 4px; }
</style>
</head>
<body>

<h2>A. 蓝色系(blue / light)</h2>
<div class="row">
  <div class="item"><img src="/icons/51-compress-blue.svg"><div class="name">default</div><div class="state">#339AF0</div></div>
  <div class="item"><img src="/icons/51-compress-blue-hover.svg"><div class="name">hover</div><div class="state">#4DABF7</div></div>
  <div class="item"><img src="/icons/51-compress-blue-active.svg"><div class="name">active</div><div class="state">#1971C2</div></div>
  <div class="item"><img src="/icons/51-compress-blue-disabled.svg"><div class="name">disabled</div><div class="state">#495057</div></div>
</div>

<h2 style="margin-top:24px">B. 绿色系(teal / cxx-ui 主题色)</h2>
<div class="row">
  <div class="item"><img src="/icons/51-compress-green.svg"><div class="name">default</div><div class="state">#4ec9b0</div></div>
  <div class="item"><img src="/icons/51-compress-green-hover.svg"><div class="name">hover</div><div class="state">#3BC9DB</div></div>
  <div class="item"><img src="/icons/51-compress-green-active.svg"><div class="name">active</div><div class="state">#0CA678</div></div>
  <div class="item"><img src="/icons/51-compress-green-disabled.svg"><div class="name">disabled</div><div class="state">#495057</div></div>
</div>

<h2 style="margin-top:24px">C. 白色系(单色,跟其他通用图标一致)</h2>
<div class="row">
  <div class="item"><img src="/icons/51-compress-white.svg"><div class="name">default</div><div class="state">#E9ECEF</div></div>
  <div class="item"><img src="/icons/51-compress-white-hover.svg"><div class="name">hover</div><div class="state">#FFFFFF</div></div>
  <div class="item"><img src="/icons/51-compress-white-active.svg"><div class="name">active</div><div class="state">#ADB5BD</div></div>
  <div class="item"><img src="/icons/51-compress-white-disabled.svg"><div class="name">disabled</div><div class="state">#495057</div></div>
</div>

</body></html>
