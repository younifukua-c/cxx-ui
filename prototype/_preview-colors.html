<!doctype html>
<html><head><meta charset="utf-8"><title>compress 颜色对比</title>
<style>
:root { --bg: #1e1e1e; --card: #252525; --line: #2f2f2f; --fg: #d4d4d4; --dim: #858585; }
body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; }
h2 { color: var(--dim); font-size: 12px; text-transform: uppercase; margin: 0 0 8px; letter-spacing: 1px; }
.row { display: flex; gap: 16px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 10px; min-width: 110px; text-align: center; }
.item img { width: 32px; height: 32px; display: block; margin: 0 auto 8px; }
.item .name { font: 11px monospace; color: var(--fg); }
</style>
</head>
<body>
<h2>A. 单色白主(跟其他通用图标一致)</h2>
<div class="row">
  <div class="item"><img src="/icons/01-settings.svg"><div class="name">settings(灰参照)</div></div>
  <div class="item"><img src="/icons/03-new-project.svg"><div class="name">new-project(绿参照)</div></div>
</div>
<h2 style="margin-top:24px">B. 彩色版(青绿) — 跟 cxx-ui 主题色一致</h2>
<div class="row">
  <div class="item"><img src="/icons/51-compress.svg"><div class="name">compress default</div></div>
  <div class="item"><img src="/icons/51-compress-hover.svg"><div class="name">hover</div></div>
  <div class="item"><img src="/icons/51-compress-active.svg"><div class="name">active</div></div>
  <div class="item"><img src="/icons/51-compress-disabled.svg"><div class="name">disabled</div></div>
</div>
</body></html>
